syntax = "proto3";

package metadata;
option go_package = "github.com/Athul0491/IceCore/gen/metadata;metadata";

service MetadataService {
    rpc CreateTable(CreateTableRequest) returns (OperationResponse);
    rpc GetTableMetadata(TableRequest) returns (TableMetadataResponse);
    rpc AlterTable(AlterTableRequest) returns (OperationResponse);
    rpc DropTable(DropTableRequest) returns (OperationResponse);
    rpc ListTables(ListTablesRequest) returns (ListTablesResponse);

    rpc GetPartitions(PartitionRequest) returns (PartitionListResponse);
    rpc GetPartitionStats(PartitionStatsRequest) returns (PartitionStatsResponse);
    rpc GetColumnStats(GetColumnStatsRequest) returns (GetColumnStatsResponse);

    rpc CommitSnapshot(SnapshotRequest) returns (SnapshotResponse);
    rpc GetSnapshot(GetSnapshotRequest) returns (SnapshotDetail);
    rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);

    rpc BeginTransaction(TransactionRequest) returns (TransactionResponse);
    rpc CommitTransaction(CommitRequest) returns (OperationResponse);
    rpc AbortTransaction(AbortRequest) returns (OperationResponse);

    rpc GetManifestList(GetManifestListRequest) returns (ManifestListResponse);
    rpc GetManifest(GetManifestRequest) returns (ManifestFileDetail);

    rpc GetPartitionSpec(GetPartitionSpecRequest) returns (PartitionSpecResponse);
    rpc ListPartitionSpecs(ListPartitionSpecsRequest) returns (ListPartitionSpecsResponse);
}


message CreateTableRequest {
    string table_name = 1;
    string schema_json = 2;
    string partition_spec = 3;
    map<string, string> properties = 4;
}

message TableRequest {
    string table_name = 1;
    uint64 snapshot_id = 2;
}

message TableMetadataResponse {
    string table_name = 1;
    string schema_json = 2;
    uint64 current_snapshot_id = 3;
    int32 schema_version = 4;
    repeated PartitionInfo partitions = 5;
    map<string, string> properties = 6;
    int64 total_row_count = 7;
    int64 total_size_bytes = 8;
}

message AlterTableRequest {
    string table_name = 1;
    oneof alteration {
        string             new_schema_json    = 2;
        PartitionSpecProto new_partition_spec = 3;
        RenameTable        rename             = 4;
    }
}

message RenameTable {
    string new_name = 1;
}

message DropTableRequest {
    string table_name = 1;
    bool purge = 2;
}

message ListTablesRequest {
    string namespace = 1;
    int32 page_size = 2;
    string page_token = 3;
}

message ListTablesResponse {
    repeated TableSummary tables = 1;
    string next_page_token = 2;
}

message TableSummary {
    string table_name = 1;
    uint64 current_snapshot_id = 2;
    int64 total_partitions = 3;
}


// ColumnStats holds per-column bounds for a single data file.
// column_id maps to the Iceberg schema field_id.
// Iceberg DataFile field alignment:
//   value_count → field 112, null_count → field 113,
//   min_value   → field 115, max_value  → field 116,
//   size_bytes  → field 117, nan_count  → field 128.
message ColumnStats {
    int32  column_id    = 1;
    int64  null_count   = 2;
    int64  nan_count    = 3;
    int64  value_count  = 4;
    string min_value    = 5;
    string max_value    = 6;
    int64  size_bytes   = 7;
}

message PartitionInfo {
    string partition_key = 1;
    string data_file_path = 2;
    int64 row_count = 3;
    int64 size_bytes = 4;
    uint64 snapshot_id = 5;
    string file_format = 6;
    repeated ColumnStats column_stats = 7;
}

message PartitionRequest {
    string table_name = 1;
    string filter_expr = 2;
    uint64 snapshot_id = 3;
    int32 page_size = 4;
    string page_token = 5;
}

message PartitionListResponse {
    repeated PartitionInfo partitions = 1;
    string next_page_token = 2;
    int64 total_count = 3;
}

message PartitionStatsRequest {
    string table_name = 1;
}

message PartitionStatsResponse {
    int64 total_partitions = 1;
    int64 total_rows = 2;
    int64 total_bytes = 3;
    int64 avg_partition_size_bytes = 4;
}


message SnapshotRequest {
    string table_name = 1;
    repeated PartitionInfo new_partitions = 2;
    repeated string deleted_partition_keys = 3;
    uint64 parent_snapshot_id = 4;
    string operation = 5;
}

message SnapshotResponse {
    uint64 snapshot_id = 1;
    bool success = 2;
    string error_msg = 3;
}

message GetSnapshotRequest {
    string table_name = 1;
    uint64 snapshot_id = 2;
}

message SnapshotDetail {
    uint64 snapshot_id = 1;
    uint64 parent_snapshot_id = 2;
    string operation = 3;
    int64 added_partitions = 4;
    int64 deleted_partitions = 5;
    string committed_at = 6;
}

message ListSnapshotsRequest {
    string table_name = 1;
    int32 limit = 2;
}

message ListSnapshotsResponse {
    repeated SnapshotDetail snapshots = 1;
}


message TransactionRequest {
    string client_id = 1;
    string table_name = 2;
    IsolationLevel isolation = 3;
}

enum IsolationLevel {
    SNAPSHOT = 0;
    READ_COMMITTED = 1;
}

message TransactionResponse {
    uint64 txn_id = 1;
    uint64 read_snapshot_id = 2;
}

message CommitRequest {
    uint64 txn_id = 1;
}

message AbortRequest {
    uint64 txn_id = 1;
}


message OperationResponse {
    bool success = 1;
    string error_msg = 2;
}


enum PartitionTransform {
    IDENTITY = 0;
    YEAR     = 1;
    MONTH    = 2;
    DAY      = 3;
    HOUR     = 4;
    BUCKET   = 5;
    TRUNCATE = 6;
}

message PartitionField {
    int32              field_id        = 1;
    string             source_column   = 2;
    PartitionTransform transform       = 3;
    int32              transform_param = 4;
}

message PartitionSpecProto {
    repeated PartitionField fields = 1;
}

message GetPartitionSpecRequest {
    string table_name   = 1;
    int32  spec_version = 2;
}

message PartitionSpecResponse {
    string             table_name    = 1;
    int32              spec_version  = 2;
    PartitionSpecProto spec          = 3;
    string             changed_at    = 4;
    string             change_summary = 5;
}

message ListPartitionSpecsRequest {
    string table_name = 1;
}

message ListPartitionSpecsResponse {
    repeated PartitionSpecResponse specs = 1;
}


message GetManifestListRequest {
    string table_name = 1;
    uint64 snapshot_id = 2;
}

message ManifestFileSummary {
    int64  manifest_file_id         = 1;
    string manifest_path            = 2;
    int32  partition_spec_id        = 3;
    int32  added_files_count        = 4;
    int32  deleted_files_count      = 5;
    int64  added_rows_count         = 6;
    int64  deleted_rows_count       = 7;
    string partition_summaries_json = 8;
}

message ManifestListResponse {
    uint64                       snapshot_id    = 1;
    int32                        manifest_count = 2;
    repeated ManifestFileSummary manifests      = 3;
}

message GetManifestRequest {
    string table_name       = 1;
    int64  manifest_file_id = 2;
}

// GetColumnStats — per-column bounds aggregated across all data files visible
// at the given snapshot. Enables query-engine partition pruning.
message GetColumnStatsRequest {
    string table_name  = 1;
    uint64 snapshot_id = 2;
}

// ColumnBounds merges the per-file ColumnStats across all visible partitions:
// null_count / nan_count / value_count are summed; min/max are the global bounds.
message ColumnBounds {
    int32  column_id   = 1;
    string min_value   = 2;
    string max_value   = 3;
    int64  null_count  = 4;
    int64  nan_count   = 5;
    int64  value_count = 6;
}

message GetColumnStatsResponse {
    uint64                snapshot_id    = 1;
    repeated ColumnBounds column_bounds  = 2;
}


message ManifestFileDetail {
    int64  manifest_file_id         = 1;
    uint64 snapshot_id              = 2;
    string manifest_path            = 3;
    int32  partition_spec_id        = 4;
    int32  added_files_count        = 5;
    int32  deleted_files_count      = 6;
    int64  added_rows_count         = 7;
    int64  deleted_rows_count       = 8;
    string partition_summaries_json = 9;
}